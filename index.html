<style>
:root{
  --ink:#1C1914; --peach:#FFDD9E; --cream:#FFF6E3; --amber:#7A4600; --paper:#FFFFFF;
  --line:#E4D3AB; --muted:#4A4338; --ok:#17603A; --ok-bg:#E6F4EA; --bad:#9B1C1C; --bad-bg:#FDEBEA; --mid:#7A4600; --mid-bg:#FFF0CC;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
a{color:var(--amber)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
.hero{background:var(--ink);color:var(--cream)}
.hero .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;padding-top:34px;padding-bottom:34px}
.hero .eyebrow{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--peach);margin:0 0 8px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,58px);line-height:1;margin:0 0 8px;letter-spacing:-.02em}
.hero .sub{margin:0;color:var(--peach);font-family:var(--display);font-weight:700;font-size:clamp(17px,3vw,22px)}
.hero img{width:clamp(70px,16vw,112px);height:auto;flex-shrink:0}

/* sticky status bar */
.bar{position:sticky;top:0;z-index:20;background:var(--peach);border-bottom:2px solid var(--ink)}
.bar .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:8px;font-weight:700;font-size:15px}
.bar .pill{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.bar .time.low{color:var(--bad)}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

main{padding:22px 0 80px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:22px 22px 24px;margin:0 0 20px}
.card.dark{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.card h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px;line-height:1.15}
.card h3{font-family:var(--display);font-weight:700;font-size:21px;margin:22px 0 4px;color:var(--amber);line-height:1.2}
.card .meta{margin:0 0 12px;color:var(--muted);font-size:15px}
.intro{margin:6px 0 12px}
.note{font-size:15px;color:var(--muted);margin:8px 0}

label.field{display:block;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px}
input[type=text]::placeholder,textarea::placeholder{color:#6b6153}
textarea{min-height:230px;resize:vertical;line-height:1.55}

table.parts{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:16px}
table.parts th,table.parts td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left}
table.parts th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber)}
table.parts td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px}
.tag.auto{background:var(--peach)}
.tag.teacher{background:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--peach);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{background:#ffd27c}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.dark:hover{background:#000}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff}

.listen{background:var(--cream);border:2px dashed var(--ink);border-radius:12px;padding:14px 16px;margin:10px 0 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.listen .txt{flex:1 1 240px;min-width:0}
.listen strong{display:block}

ol.items{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
li.q{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
li.q .stem{display:flex;gap:10px}
li.q .num{font-weight:800;min-width:26px;color:var(--amber)}
li.q .txt{flex:1;min-width:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;float:left;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;clear:both}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-block;min-height:44px;padding:9px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:500}
.opt input:checked + span{background:var(--ink);color:var(--cream)}
.opt input:focus-visible + span{outline:3px solid var(--amber);outline-offset:2px}
input.gap{display:inline-block;width:auto;min-width:130px;max-width:100%;padding:6px 10px;margin:0 4px;border-radius:8px;border-width:0 0 2px 0;border-bottom-color:var(--ink);background:var(--cream)}
input.gap.long{display:block;width:100%;margin:8px 0 0;border-width:2px;border-radius:10px;background:#fff;padding:10px 12px}

.wordbox{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.wordbox span{background:var(--peach);border:1.5px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700}

.passage{background:var(--cream);border-left:6px solid var(--ink);border-radius:6px;padding:14px 18px;margin:10px 0 6px}
.passage h4{font-family:var(--display);margin:0 0 8px;font-size:20px}
.passage p{margin:0 0 10px}
.passage p:last-child{margin-bottom:0}

.wc{font-weight:700;margin:8px 0 0}
.wc.good{color:var(--ok)} .wc.warn{color:var(--mid)}
ul.bul{margin:6px 0 10px;padding-left:22px}

figure.pic{margin:12px 0}
figure.pic img{width:100%;max-width:560px;height:auto;display:block;border:2px solid var(--ink);border-radius:12px}
figure.pic figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.pics2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.pics2{grid-template-columns:1fr}}

/* feedback */
li.q.ok{border-color:var(--ok);background:var(--ok-bg)}
li.q.bad{border-color:var(--bad);background:var(--bad-bg)}
li.q.mid{border-color:var(--mid);background:var(--mid-bg)}
.fb{margin-top:8px;font-size:16px;display:flex;flex-direction:column;gap:2px}
.fb .verdict{font-weight:800}
li.ok .verdict{color:var(--ok)} li.bad .verdict{color:var(--bad)} li.mid .verdict{color:var(--mid)}
.fb .why{color:var(--muted);font-size:15px}
.fb .unit{font-size:14px;font-weight:700;color:var(--amber)}

.locked input[type=text],.locked textarea{pointer-events:none;background:#f3ecd9}
.locked .opt input{pointer-events:none}

/* results */
#results[hidden]{display:none}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0}
.score .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--peach)}
.score .of{font-size:22px;font-weight:700}
.card.dark table.parts th{color:var(--peach)} .card.dark table.parts th,.card.dark table.parts td{border-color:#4a4338}
.rev{margin:10px 0 0;padding-left:20px}
.status{margin:12px 0 0;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status.okk{color:#9be3b1} .status.err{color:#ffb4ab}
.submitbox{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.msg{font-weight:700;color:var(--bad)}
.msg.info{color:var(--mid)}
footer{padding:0 0 30px;text-align:center;color:var(--muted);font-size:14px}
footer img{width:40px;height:auto;display:block;margin:0 auto 6px}
@media (max-width:520px){body{font-size:16px}.card{padding:18px 14px}.bar .wrap{font-size:14px;gap:8px}}
@media print{.bar,.btn{display:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div>
      <p class="eyebrow">Tevfik Online School</p>
      <h1 id="h-title"></h1>

    if (v === false || v == null) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

loadVoices();

function pickVoice(idx){
  if (!voices.length) return null;
  var gb = voices.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var pool = gb.length > 1 ? gb : voices;
  return pool[idx % pool.length];
}
function makePlayer(cfg, uid){
  var maxPlays = cfg.plays || 2, plays = 0, playing = false;
  var btn = h('button', {class:'btn dark', type:'button'});
  var info = h('div', {class:'note', 'aria-live':'polite'});

  } else {

    var i = 0, speakers = {}, order = [];
    cfg.script.forEach(function(l){ if (!speakers[l.who]) { speakers[l.who] = order.length; order.push(l.who); } });
    function next(){

      if (i >= cfg.script.length){ playing = false; label(); return; }
      var l = cfg.script[i++];

      var v = pickVoice(speakers[l.who]); if (v) { u.voice = v; u.lang = v.lang; }

    next();
  }
  btn.addEventListener('click', function(){
    if (playing){ token++; window.speechSynthesis.cancel(); playing = false; label(); return; }

    window.speechSynthesis.cancel();
    speakLines(token);
  });

}

function renderPassage(p){
  var a = h('article', {class:'passage'});
  if (p.title) a.appendChild(h('h4', {text:p.title}));
  p.paras.forEach(function(t){ a.appendChild(h('p', {text:t})); });
  return a;
}
function renderPics(list, caption){
  var wrap = h('div', {class: list.length > 1 ? 'pics2' : ''});
  list.forEach(function(p){ wrap.appendChild(h('figure', {class:'pic'}, h('img', {src:p.src, alt:p.alt}), h('figcaption', {text:p.cap}))); });
  return wrap;
}
var partsEl = $('#parts');
var WR = {min:60, max:80};
T.parts.forEach(function(part){
  var card = h('section', {class:'card', id:part.id, 'aria-labelledby':part.id + '-h'});
  card.appendChild(h('h2', {id:part.id + '-h', text:part.title}));
  card.appendChild(h('p', {class:'meta', text:part.meta}));
  part.sections.forEach(function(sec){
    if (sec.title) card.appendChild(h('h3', {text:sec.title}));
    if (sec.intro) card.appendChild(h('p', {class:'intro', text:sec.intro}));
    if (sec.listen) card.appendChild(sec.listen.kind === 'link'
      ? h('div', {class:'listen'}, h('div', {class:'txt'}, h('strong', {text:sec.listen.label}), h('div', {class:'note', text:sec.listen.note})),
          h('a', {class:'btn dark', href:sec.listen.url, target:'_blank', rel:'noopener noreferrer', text:'Open the story ↗'}))
      : makePlayer(sec.listen, sec.id));
    if (sec.wordbox) {
      var wb = h('div', {class:'wordbox', role:'list', 'aria-label':'Word box'});
      sec.wordbox.forEach(function(w){ wb.appendChild(h('span', {role:'listitem', text:w})); });
      card.appendChild(wb);
    }
    if (sec.passage) card.appendChild(renderPassage(sec.passage));
    if (sec.items) {
      var ol = h('ol', {class:'items'});
      sec.items.forEach(function(item, i){
        item.n = i + (sec.start || 1); item.uid = sec.id + '-' + (i + 1); item.sec = sec.id; item.part = part.id; item.m = item.m || 1;
        ITEMS.push(item);
        ol.appendChild(renderItem(item, item.uid));
      });
      card.appendChild(ol);
    }
    if (sec.writing) {
      WR = {min:sec.writing.min, max:sec.writing.max};
      var ul = h('ul', {class:'bul'}); sec.writing.bullets.forEach(function(b){ ul.appendChild(h('li', {text:b})); });
      card.appendChild(ul);
      if (sec.writing.opening) card.appendChild(h('p', {class:'intro', text:sec.writing.opening}));
      var ta = h('textarea', {id:'writing', 'aria-label':'Your writing', placeholder:'Write here…', spellcheck:'true'});
      card.appendChild(ta);
      card.appendChild(h('div', {class:'wc', id:'wc', 'aria-live':'polite', text:'0 words (aim for ' + WR.min + ' to ' + WR.max + ')'}));
      card.appendChild(h('p', {class:'note', text:'Your teacher will mark your writing. It is sent with your results.'}));
    }
    if (sec.speaking) {
      sec.speaking.blocks.forEach(function(b){
        if (b.title) card.appendChild(h('h3', {text:b.title}));
        if (b.pics) card.appendChild(renderPics(b.pics));
        if (b.list) { var u2 = h('ul', {class:'bul'}); b.list.forEach(function(x){ u2.appendChild(h('li', {text:x})); }); card.appendChild(u2); }
        if (b.note) card.appendChild(h('p', {class:'note', text:b.note}));
      });
    }
  });
  partsEl.appendChild(card);
});

/* ---------- state, autosave, timer ---------- */
var submitted = false, started = null, timerId = null;
function readAnswer(item){
  if (item.t === 'mcq' || item.t === 'tf' || item.t === 'tfn') { var r = $('input[name="' + item.uid + '"]:checked'); return r ? r.value : ''; }
  var i = document.getElementById(item.uid); return i ? i.value : '';
}
function answered(){ return ITEMS.filter(function(it){ return readAnswer(it).trim() !== ''; }).length; }
function snapshot(){
  var a = {}; ITEMS.forEach(function(it){ a[it.uid] = readAnswer(it); });
  return {name:$('#stu-name').value, a:a, w:($('#writing')||{}).value || '', started:started};
}
function save(){ if (!submitted) store(KEY, JSON.stringify(snapshot())); }
function restore(){
  var raw = store(KEY); if (!raw) return;
  try {
    var s = JSON.parse(raw);
    $('#stu-name').value = s.name || '';
    ITEMS.forEach(function(it){
      var v = s.a && s.a[it.uid]; if (!v) return;
      if (it.t === 'mcq' || it.t === 'tf' || it.t === 'tfn') { var r = $('input[name="' + it.uid + '"][value="' + v + '"]'); if (r) r.checked = true; }
      else document.getElementById(it.uid).value = v;
    });
    if ($('#writing')) { $('#writing').value = s.w || ''; updateWc(); }
    if (s.started) { started = s.started; startTimer(); }
  } catch(e){}
}
function fmt(ms){ var s = Math.max(0, Math.round(ms/1000)); var m = Math.floor(s/60); s = s % 60; return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s; }
function tick(){
  if (!started || submitted) return;
  var left = T.minutes*60000 - (Date.now() - started);
  var el = $('#bar-time'); el.textContent = left > 0 ? fmt(left) : 'Time is up';
  el.classList.toggle('low', left < 5*60000);
}
function startTimer(){ if (timerId) return; timerId = setInterval(tick, 1000); tick(); }
function refreshBar(){
  $('#bar-done').textContent = String(answered());
  var n = $('#stu-name').value.trim();
  $('#bar-name').textContent = n || 'Your name is needed';
}
function updateWc(){
  var w = words($('#writing').value), el = $('#wc');
  var aim = ' (aim for ' + WR.min + ' to ' + WR.max + ')';
  el.textContent = w + (w === 1 ? ' word' : ' words') + (w < WR.min ? aim : w <= WR.max ? ' ✔ good length' : ' (a bit long:' + aim.slice(2));
  el.className = 'wc ' + (w >= WR.min && w <= WR.max ? 'good' : (w > WR.max ? 'warn' : ''));
}
document.addEventListener('input', function(e){
  if (submitted) return;
  if (!started && e.target.id !== 'stu-name') { started = Date.now(); startTimer(); }
  if (e.target.id === 'writing') updateWc();
  $('#submit-msg').textContent = ''; confirmEmpty = false; $('#submit').textContent = 'Submit my test';
  refreshBar(); save();
});
document.addEventListener('change', function(e){
  if (submitted || !e.target.matches('input[type=radio]')) return;
  if (!started) { started = Date.now(); startTimer(); }
  refreshBar(); save();
});
restore(); refreshBar();
$('#bar-time').textContent = fmt(T.minutes*60000);

/* ---------- marking ---------- */
function matchRules(text, groups){
  if (!groups) return false;
  return groups.some(function(g){ return g.every(function(re){ return re.test(text); }); });
}
function mark(item){
  var raw = readAnswer(item), res = {item:item, raw:raw, score:0, state:'bad', shown:'', correct:''};
  if (item.t === 'mcq') {
    var L = function(i){ return String.fromCharCode(97+i) + ') ' + item.opts[i]; };
    res.shown = raw === '' ? '' : L(+raw); res.correct = L(item.a);
    if (raw !== '' && +raw === item.a) { res.score = item.m; res.state = 'ok'; }
  } else if (item.t === 'tf') {
    res.shown = raw === '' ? '' : (raw === 'true' ? 'True' : 'False'); res.correct = item.a ? 'True' : 'False';
    if (raw !== '' && (raw === 'true') === item.a) { res.score = item.m; res.state = 'ok'; }
  } else if (item.t === 'tfn') {
    var LB = {'true':'True','false':'False','ng':'Not given'};
    res.shown = raw === '' ? '' : LB[raw]; res.correct = LB[item.a];
    if (raw !== '' && raw === item.a) { res.score = item.m; res.state = 'ok'; }
  } else if (item.t === 'gap') {
    res.shown = raw.trim(); res.correct = item.show || item.ans[0];
    var nr = norm(raw);
    var okGap = item.ans.some(function(a){ return norm(a) === nr; }) ||
      (item.rx && nr && item.rx.some(function(re){ return re.test(nr); }) && !(item.no && item.no.test(nr)));
    if (okGap) { res.score = item.m; res.state = 'ok'; }
  } else if (item.t === 'short') {
    var t = norm(raw); res.shown = raw.trim(); res.correct = item.model; res.provisional = true;
    if (t && matchRules(t, item.full)) { res.score = item.m; res.state = 'ok'; }
    else if (t && matchRules(t, item.half)) { res.score = Math.max(1, Math.floor(item.m/2)); res.state = 'mid'; }
  }
  return res;
}

/* ---------- submit ---------- */
var confirmEmpty = false, RESULT = null;
$('#submit').addEventListener('click', function(){
  if (submitted) return;
  var msg = $('#submit-msg'); msg.className = 'msg'; msg.textContent = '';
  var name = $('#stu-name').value.trim();
  if (!name) { msg.textContent = 'Please type your name at the top of the page first.'; $('#start').scrollIntoView({block:'start'}); $('#stu-name').focus(); return; }
  var missing = ITEMS.length - answered();
  if (missing > 0 && !confirmEmpty) {
    confirmEmpty = true; msg.className = 'msg info';
    msg.textContent = 'You have ' + missing + ' question' + (missing === 1 ? '' : 's') + ' without an answer. Press the button again to submit anyway, or go back and finish them.';
    this.textContent = 'Submit anyway'; return;
  }
  finish(name);
});

function finish(name){
  submitted = true; clearInterval(timerId);
  var elapsed = started ? Date.now() - started : 0;
  document.body.classList.add('locked');
  $$('input,textarea,button.btn').forEach(function(e){ if (e.id !== 'copy-report' && e.id !== 'retry') { if (e.matches('input[type=radio]')) { e.style.pointerEvents = 'none'; } } });
  $('#parts').classList.add('locked'); $('#start').classList.add('locked'); $('#stu-name').readOnly = true;
  $('#submit').disabled = true; $('#submit-card').hidden = true;

  var results = ITEMS.map(mark);
  var bySec = {}, byPart = {};
  results.forEach(function(r){
    var li = document.getElementById('q-' + r.item.uid);
    li.classList.add(r.state);
    var fb = h('div', {class:'fb'});
    var verdict = r.state === 'ok' ? '✔ Correct' : (r.state === 'mid' ? '◐ Partly right: ' + r.score + ' of ' + r.item.m + ' marks' : (r.shown === '' ? '✘ No answer' : '✘ Not correct'));
    fb.appendChild(h('span', {class:'verdict', text:verdict}));
    if (r.state !== 'ok') {
      if (r.shown !== '') fb.appendChild(h('span', {text:'Your answer: ' + r.shown}));
      fb.appendChild(h('span', {text:(r.item.t === 'short' ? 'A good answer: ' : 'Correct answer: ') + r.correct}));
    }
    if (r.item.why && r.state !== 'ok') fb.appendChild(h('span', {class:'why', text:r.item.why}));
    if (r.item.t === 'short') fb.appendChild(h('span', {class:'why', text:'This answer was marked by the computer. Your teacher will check it.'}));
    if (r.item.u && r.state !== 'ok') fb.appendChild(h('span', {class:'unit', text:'Revise: Unit ' + r.item.u.join(' and ') + ' (' + r.item.u.map(function(u){ return UNITS[u]; }).join('; ') + ')'}));
    li.appendChild(fb);
    bySec[r.item.sec] = bySec[r.item.sec] || {score:0, max:0};
    bySec[r.item.sec].score += r.score; bySec[r.item.sec].max += r.item.m;
    byPart[r.item.part] = byPart[r.item.part] || {score:0, max:0};
    byPart[r.item.part].score += r.score; byPart[r.item.part].max += r.item.m;
  });
  var auto = 0, autoMax = 0;
  Object.keys(byPart).forEach(function(k){ auto += byPart[k].score; autoMax += byPart[k].max; });
  var pct = autoMax ? Math.round(auto*100/autoMax) : 0;

  // units to revise
  var units = {};
  results.forEach(function(r){ if (r.state !== 'ok' && r.item.u) r.item.u.forEach(function(u){ units[u] = (units[u]||0) + 1; }); });
  var unitList = Object.keys(units).map(Number).sort(function(a,b){ return a-b; });

  RESULT = {name:name, auto:auto, autoMax:autoMax, pct:pct, elapsed:elapsed, results:results, byPart:byPart, bySec:bySec, units:units, unitList:unitList,
            writing:($('#writing')||{}).value || ''};
  renderResults(RESULT);
  store(KEY, null);
  send(RESULT);
  $('#results').scrollIntoView({block:'start'});
}

function verdictText(p){
  if (p >= 90) return 'Excellent work!'; if (p >= 75) return 'Very good!'; if (p >= 60) return 'Good job!';
  if (p >= 40) return 'Some topics need more revision. Look at the list below.'; return 'Let’s revise this together. Look at the list below.';
}
function renderResults(R){
  var box = $('#results'); box.hidden = false; box.innerHTML = '';
  var c = h('div', {class:'card dark'});
  c.appendChild(h('h2', {text:'Your results, ' + R.name}));
  c.appendChild(h('div', {class:'score'}, h('span', {class:'big', text:String(R.auto)}), h('span', {class:'of', text:'out of ' + R.autoMax + ' on the parts marked for you (' + R.pct + '%)'})));
  c.appendChild(h('p', {text:verdictText(R.pct)}));
  var tb = h('tbody');
  T.parts.forEach(function(p){
    var s = R.byPart[p.id];
    tb.appendChild(h('tr', {}, h('td', {text:p.title.replace(/^Part \d+: /,'')}),
      h('td', {class:'n', text: s ? s.score + ' / ' + s.max : 'Teacher'})));
  });
  c.appendChild(h('table', {class:'parts'}, h('thead', {}, h('tr', {}, h('th', {text:'Part'}), h('th', {class:'n', text:'Score'}))), tb));
  c.appendChild(h('p', {class:'note', style:'color:#FFF6E3', text:'Writing and Speaking (' + T.teacherMarks + ' marks) are marked by ' + T.teacher + ', who will add them to your total of ' + T.total + '.'}));
  if (R.unitList.length) {
    c.appendChild(h('h3', {style:'color:#FFDD9E', text:'Topics to revise'}));
    var ul = h('ul', {class:'rev'});
    R.unitList.forEach(function(u){ ul.appendChild(h('li', {text:'Unit ' + u + ': ' + UNITS[u] + ' (' + R.units[u] + (R.units[u] === 1 ? ' mistake' : ' mistakes') + ')'})); });
    c.appendChild(ul);
    c.appendChild(h('p', {class:'note', style:'color:#FFF6E3', text:'Check the unit numbers against the contents page of your Classbook.'}));
  }
  c.appendChild(h('p', {class:'note', style:'color:#FFF6E3', text:'Scroll up to see every correction under each question.'}));
  c.appendChild(h('div', {class:'status', id:'send-status', role:'status', 'aria-live':'polite'}, h('span', {text:'Sending your results to your teacher…'})));
  box.appendChild(c);
}

/* ---------- report and Formspree ---------- */
function buildReport(R){
  var L = [];
  L.push(T.title + ' (' + T.subtitle + ') — Family & Friends 4');
  L.push('Student: ' + R.name);
  L.push('Submitted: ' + new Date().toLocaleString('en-GB', {dateStyle:'full', timeStyle:'short'}));
  L.push('Time used: ' + (R.elapsed ? fmt(R.elapsed) + ' of ' + T.minutes + ':00' : 'not recorded'));
  L.push('');
  L.push('AUTO-MARKED SCORE: ' + R.auto + ' / ' + R.autoMax + ' (' + R.pct + '%)');
  T.parts.forEach(function(p){ var s = R.byPart[p.id]; L.push('  ' + p.title + ': ' + (s ? s.score + ' / ' + s.max : 'for the teacher to mark (' + p.marks + ' marks)')); });
  L.push('Still to mark by teacher: Writing and Speaking = ' + T.teacherMarks + ' marks. Total possible: ' + T.total + '.');
  L.push('');
  var wrong = R.results.filter(function(r){ return r.state !== 'ok'; });
  L.push('CORRECTIONS (' + wrong.length + ' question' + (wrong.length === 1 ? '' : 's') + ' not fully right)');
  wrong.forEach(function(r){
    L.push('  ' + r.item.sec + ' Q' + r.item.n + ': ' + r.item.q.replace(/___/g, '____'));
    L.push('     Student: ' + (r.shown === '' ? '(no answer)' : r.shown) + '  |  Correct: ' + r.correct + (r.item.t === 'short' ? '  |  Provisional marks: ' + r.score + '/' + r.item.m : ''));
  });
  var shorts = R.results.filter(function(r){ return r.item.t === 'short'; });
  L.push('');
  L.push('SHORT ANSWERS: student answers and provisional marks (please check)');
  shorts.forEach(function(r){ L.push('  Q' + r.item.n + ' [' + r.score + '/' + r.item.m + ']: ' + (r.shown || '(no answer)')); });
  L.push('');
  L.push('TOPICS TO REVISE: ' + (R.unitList.length ? R.unitList.map(function(u){ return 'Unit ' + u + ' (' + UNITS[u] + ', ' + R.units[u] + ')'; }).join('; ') : 'none from the grammar parts'));
  L.push('');
  L.push('WRITING (' + words(R.writing) + ' words) — for the teacher to mark out of 15:');
  L.push(R.writing.trim() || '(nothing written)');
  return L.join('\n');
}
function setStatus(ok, text, retry){
  var s = $('#send-status'); if (!s) return;
  s.className = 'status ' + (ok ? 'okk' : 'err'); s.innerHTML = '';
  s.appendChild(h('span', {text:text}));
  if (retry) {
    s.appendChild(h('button', {class:'btn ghost', type:'button', id:'retry', text:'Try again', onclick:function(){ send(RESULT); }}));
    s.appendChild(h('button', {class:'btn ghost', type:'button', id:'copy-report', text:'Copy my results', onclick:function(){ copyReport(); }}));
  }
}
function copyReport(){
  var text = buildReport(RESULT);
  function fallback(){ var ta = h('textarea', {style:'position:fixed;left:-9999px'}); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback); else fallback();
  var s = $('#send-status'); if (s) s.appendChild(h('span', {text:' Copied. Please send it to your teacher.'}));
}
function send(R){
  setStatus(true, 'Sending your results to your teacher…');
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var to = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 20000);
  var body = {
    _subject: T.title + ' — ' + R.name + ' — ' + R.auto + '/' + R.autoMax + ' auto-marked',
    student: R.name, test: T.title, score_auto: R.auto + '/' + R.autoMax, percent: R.pct + '%',
    time_used: R.elapsed ? fmt(R.elapsed) : '', message: buildReport(R)
  };
  fetch(T.formUrl, {method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, body:JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined})
    .then(function(r){ clearTimeout(to); if (!r.ok) throw new Error('HTTP ' + r.status); setStatus(true, '✔ Your marks and corrections were sent to ' + T.teacher + '.'); })
    .catch(function(){ clearTimeout(to); setStatus(false, 'We could not send your results. Check your internet and press “Try again”.', true); });
}
})();
</script>
